# 绑定 IP（0.0.0.0 表示允许所有 IP 连接）
bind 0.0.0.0

# 端口
port 6379

# 后台运行
daemonize yes

# 密码（必须设置！）
requirepass yourpassword123

# 持久化方式
save 900 1        # 900秒内有1次修改，触发RDB
save 300 10       # 300秒内有10次修改
# 或使用 AOF
appendonly yes
appendfilename "appendonly.aof"

# 日志文件
logfile /var/log/redis/redis-server.log

# 工作目录
dir /var/lib/redis