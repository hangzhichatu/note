<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>动态 iframe 窗口切换</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
    }
    .controls {
      margin-bottom: 15px;
    }
    button {
      margin: 5px;
      padding: 10px 15px;
      font-size: 14px;
    }
    select {
      padding: 10px;
      font-size: 14px;
    }
    #contentFrame {
      width: 100%;
      height: 600px;
      border: 1px solid #ccc;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>动态切换 iframe 内容</h2>

  <!-- 控制按钮 -->
  <div class="controls">
    <button onclick="loadPage('https://www.baidu.com')">加载 百度</button>
    <button onclick="loadPage('https://www.bing.com')">加载 Bing</button>
    <button onclick="loadPage('https://developer.mozilla.org')">加载 MDN</button>
    <button onclick="loadPage('https://httpbin.org/html')">加载测试页面</button>
  </div>

  <!-- 下拉菜单切换 -->
  <div class="controls">
    <label for="siteSelect">选择网站：</label>
    <select id="siteSelect" onchange="changePage()">
      <option value="">-- 选择一个网站 --</option>
      <option value="https://www.baidu.com">百度</option>
      <option value="https://www.bing.com">Bing</option>
      <option value="https://developer.mozilla.org">MDN Web Docs</option>
      <option value="https://httpbin.org/html">HTTPBin 测试页</option>
    </select>
  </div>

  <!-- iframe 展示窗口 -->
  <iframe 
    id="contentFrame" 
    src="about:blank" 
    frameborder="0" 
    allowfullscreen>
  </iframe>

  <script>
    // 获取 iframe 元素
    const frame = document.getElementById('contentFrame');

    // 方法1：通过按钮调用
    function loadPage(url) {
      frame.src = url;
    }

    // 方法2：通过下拉框切换
    function changePage() {
      const select = document.getElementById('siteSelect');
      const url = select.value;
      if (url) {
        loadPage(url);
      }
    }

    // 可选：监听页面加载完成
    frame.onload = function() {
      console.log('当前页面已加载：', frame.src);
    };
  </script>

</body>
</html>
